name: Release packages

# Windows / Linux / Android 三平台安装包统一在 CI 构建并附加到 Release。
# Linux 的 AppImage/deb 与 Windows 的 NSIS 在 Ubuntu/Windows runner 上分别原生构建（本地 Windows 无法交叉出 Linux 包）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web dist
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec rspack build
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  linux:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build Linux AppImage and deb
        run: |
          pnpm --dir desktop install --frozen-lockfile
          rm -rf desktop/dist
          cp -r web/dist desktop/dist
          pnpm --dir desktop exec electron-builder --linux AppImage deb --x64 \
            --config desktop/electron-builder.yml \
            --config.directories.output=out/ci-linux
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            out/ci-linux/*.AppImage
            out/ci-linux/*.deb
          if-no-files-found: error

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build Windows NSIS and portable zip
        shell: pwsh
        run: |
          pnpm --dir desktop install --frozen-lockfile
          Remove-Item -Recurse -Force desktop/dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse web/dist desktop/dist
          pnpm --dir desktop exec electron-builder --win nsis zip --x64 --config desktop/electron-builder.yml --config.directories.output=out/ci-win
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            out/ci-win/*.exe
            out/ci-win/*.zip
          if-no-files-found: error

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build debug APK
        run: |
          pnpm --dir mobile install --frozen-lockfile
          rm -rf mobile/www
          cp -r web/dist mobile/www
          mkdir -p mobile/www/licenses
          cp LICENSE mobile/www/licenses/LICENSE-APP.txt
          cp LICENSE-UPSTREAM mobile/www/licenses/LICENSE-UPSTREAM.txt
          cp NOTICE.md mobile/www/licenses/NOTICE.md
          pnpm --dir mobile exec cap sync android
          cd mobile/android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aurora Chat ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/windows-packages/*
            artifacts/linux-packages/*
            artifacts/android-apk/*
          fail_on_unmatched_files: true
